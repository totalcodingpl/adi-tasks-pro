<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1a2a6c" />
            <stop offset="50%" stop-color="#b21f1f" />
            <stop offset="100%" stop-color="#fdbb2d" />
        </linearGradient>
        <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4facfe" />
            <stop offset="100%" stop-color="#00f2fe" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="15" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    <!-- Tło Glassmorphism -->
    <rect width="512" height="512" rx="110" fill="url(#bg)" />
    <rect width="472" height="472" x="20" y="20" rx="90" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.1)" stroke-width="4" />
    
    <!-- Stylizowana litera "A" połączona z Checkmarkiem -->
    <path d="M 256 120 L 130 380 L 200 380 L 225 310 L 335 310 L 350 350 M 245 250 L 315 250" fill="none" stroke="url(#neon)" stroke-width="35" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <path d="M 170 290 L 350 110" fill="none" stroke="#00e676" stroke-width="40" stroke-linecap="round" filter="url(#glow)" />
</svg>