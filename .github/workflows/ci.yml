name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: phpstan, phpunit
      - name: Run PHPStan
        run: phpstan analyse . --level=max
      - name: Run PHPUnit
        run: phpunit
